function answer(i){clearT();let x=S.questions[S.q],bs=[...document.querySelectorAll(".answer")];bs.forEach(b=>b.disabled=true);bs[x[3]].classList.add("good");if(i===x[3]){S.correct++;S.home?S.h++:S.a++;$("feedback").textContent="⚽ ¡GOOOOL!"}else{S.wrong++;S.home?S.a++:S.h++;if(i>=0)bs[i].classList.add("bad");$("feedback").textContent=i<0?"⏱️ Tiempo agotado":"🔴 ¡Gol del rival!"}$("homeScore").textContent=S.h;$("awayScore").textContent=S.a;setTimeout(()=>{S.q++;S.q<6?loadQ():finishMatch()},450)}
function finishMatch(){let f=S.rounds[S.round-1].find(x=>x.home===S.club||x.away===S.club);addResult(f.home,f.away,S.home?S.h:S.a,S.home?S.a:S.h);let rows=Object.entries(S.table).sort((a,b)=>(b[1].p-a[1].p)||((b[1].gf-b[1].ga)-(a[1].gf-a[1].ga))),pos=rows.findIndex(x=>x[0]===S.club)+1,r=S.table[S.club];$("emoji").textContent=(S.home?S.h:S.a)>(S.home?S.a:S.h)?"🏆":"⚽";$("resultTitle").textContent=(S.home?S.h:S.a)>(S.home?S.a:S.h)?"¡VICTORIA!":"PARTIDO TERMINADO";$("final").textContent=f.home+" "+S.h+" — "+S.a+" "+f.away;$("resultText").textContent="Jornada "+S.round+" • "+S.correct+" aciertos de 6";$("stats").innerHTML=`<span class="stat"><b>${S.correct}</b>Aciertos</span><span class="stat"><b>${S.wrong}</b>Errores</span>`;$("position").innerHTML=`<b style="color:#55e49b">POSICIÓN ACTUAL</b><br><strong style="font-size:28px">${pos}º de ${rows.length}</strong><br>${S.club} • ${r.p} puntos • ${r.w}G ${r.d}E ${r.l}P`;S.round++;renderCareer();$("next").textContent=S.round>S.rounds.length?"VER TEMPORADA":"SIGUIENTE JORNADA →";$("next").onclick=()=>S.round>S.rounds.length?finishSeason():startMatch();go("result")}
function finishSeason(){let rows=Object.entries(S.table).sort((a,b)=>(b[1].p-a[1].p)||((b[1].gf-b[1].ga)-(a[1].gf-a[1].ga))),pos=rows.findIndex(x=>x[0]===S.club)+1;$("emoji").textContent=pos===1?"🏆":"🏁";$("resultTitle").textContent=pos===1?"¡CAMPEÓN!":"TEMPORADA TERMINADA";$("final").textContent=S.club;$("resultText").textContent=pos===1?"Ganaste el título de liga.":"No ganaste el título esta temporada.";$("stats").innerHTML=`<span class="stat"><b>${pos}º</b>Posición final</span><span class="stat"><b>${S.table[S.club].p}</b>Puntos</span>`;$("position").innerHTML=`Campeón: <b>${rows[0][0]}</b><br>Tu posición: <b>${pos}º</b>`;$("next").textContent="VOLVER A LA CARRERA";$("next").onclick=()=>go("career");$("result").querySelector(".result").insertAdjacentHTML("beforeend",'<button id="homeRestart" class="btn dark" style="margin-top:10px">🏠 VOLVER AL INICIO Y ELEGIR OTRO CLUB</button>');$("homeRestart").onclick=()=>location.reload()}
function renderCups(){let f=flag(S.country),list=[];if(S.country==="🇦🇷 Argentina")list=["Torneo Apertura","Torneo Clausura","Copa Argentina","Supercopa Argentina","Supercopa Internacional","Copa Libertadores","Copa Sudamericana","Mundial de Clubes"];else if(S.country==="🇵🇪 Perú")list=["Liga1 Apertura","Liga1 Clausura","Liga1 Play-Offs","Copa Caliente de la Liga","Copa Perú","Copa Libertadores","Copa Sudamericana","Mundial de Clubes"];else{let m={"🇪🇸 España":"Copa del Rey","🇬🇧 Inglaterra":"FA Cup","🇮🇹 Italia":"Coppa Italia","🇩🇪 Alemania":"DFB-Pokal","🇫🇷 Francia":"Coupe de France","🇵🇹 Portugal":"Taça de Portugal"};if(m[S.country])list=[m[S.country]]}$("cupsGrid").innerHTML=list.map(x=>`<div class="card"><div class="flag">🏆</div><h3>${x}</h3><small>Competición</small></div>`).join("")||'<div class="panel">Las competiciones internacionales se asignarán según tu posición final.</div>'}
$("countrySearch").oninput=()=>{let q=$("countrySearch").value.toLowerCase();renderCountries(Object.entries(DATA).filter(([k,v])=>k.toLowerCase().includes(q)||cname(k).toLowerCase().includes(q)))};
$("clubSearch").oninput=()=>{let q=$("clubSearch").value.toLowerCase();renderClubs(DATA[S.country].c.filter(c=>c.toLowerCase().includes(q)))};
document.querySelectorAll(".len").forEach(b=>b.onclick=()=>{S.length=+b.dataset.n;document.querySelectorAll(".len").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("lenInfo").textContent=S.length===999?"Temporada completa":S.length+" jornadas"});
renderCountries();
</script></body></html>
